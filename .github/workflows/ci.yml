name: CI — Tests & Security Contract

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax & manifest gate (node --check)
        shell: bash
        run: |
          node --check extension.js
          node --check test.js
          for f in src/storage/*.js src/host/*.js src/webview/*.js; do
            node --check "$f"
          done

      - name: Run zero-dependency test suite (node:test)
        run: npm test
